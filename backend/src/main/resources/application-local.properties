# ─────────────────────────────────────────────────────────────────────────────
# application-local.properties — LOCAL DEVELOPER TEMPLATE
# DO NOT commit this file with real values.
# Set the values below via environment variables before running the app.
# See README.md for PowerShell and bash examples.
# ─────────────────────────────────────────────────────────────────────────────

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/gym_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ── Email (Gmail SMTP) ────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=true

# ── Cashfree ──────────────────────────────────────────────────────────────────
cashfree.appId=${CASHFREE_APP_ID}
cashfree.secretKey=${CASHFREE_SECRET_KEY}
cashfree.environment=SANDBOX
cashfree.apiBaseUrl=https://sandbox.cashfree.com
cashfree.returnUrl=http://localhost:5173/checkout/result
cashfree.notificationUrl=http://localhost:8081/cashfree/callback

# ── PayPal ────────────────────────────────────────────────────────────────────
# VITE_PAYPAL_CLIENT_ID is set in frontend/.env — never expose secret key in frontend
# paypal.sandbox.client-id=${PAYPAL_SANDBOX_CLIENT_ID}

# ── App ───────────────────────────────────────────────────────────────────────
app.frontend.url=http://localhost:5173
server.port=8081
