# ============================================
# Application Configuration
# ============================================
spring.application.name=gym-management

# Active profile — switch to 'prod' for MySQL deployment
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ============================================
# MySQL Database Configuration
# Change username/password to match your MySQL setup
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gym_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:harshadgund@25}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / Hibernate Configuration
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================
# JWT Configuration
# ============================================
jwt.secret=gym_management_super_secret_key_change_this_in_production_must_be_at_least_256_bits
jwt.expiration=86400000

# ============================================
# Server Configuration
# ============================================
server.port=${PORT:8080}


# Cashfree configuration (use environment variables in your runtime)
cashfree.env=${CASHFREE_ENV:SANDBOX}
cashfree.appId=${CASHFREE_APP_ID:}
cashfree.secretKey=${CASHFREE_SECRET_KEY:}
cashfree.returnUrl=${CASHFREE_RETURN_URL:http://localhost:3000/checkout/result}
cashfree.webhookSecret=${CASHFREE_WEBHOOK_SECRET:}
cashfree.apiBaseUrl=${CASHFREE_API_BASE_URL:https://sandbox.cashfree.com}
cashfree.notificationUrl=${CASHFREE_NOTIFICATION_URL:http://localhost:8081/cashfree/callback}

# Frontend URL used by server-side redirects
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}

# SMTP / Email (Gmail SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:harshadgund29@gmail.com}
spring.mail.password=${MAIL_PASSWORD:idtgshyrtzzizzjq}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.from=${MAIL_FROM:harshadgund29@gmail.com}

# Admin email for notifications
app.admin.email=${ADMIN_EMAIL:}
