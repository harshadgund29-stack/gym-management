# ============================================
# Application Configuration
# ============================================
spring.application.name=gym-management

# ============================================
# MySQL Database Configuration
# Change username/password to match your MySQL setup
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gym_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:harshadgund@25}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / Hibernate Configuration
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================
# JWT Configuration
# ============================================
jwt.secret=gym_management_super_secret_key_change_this_in_production_must_be_at_least_256_bits
jwt.expiration=86400000

# ============================================
# Server Configuration
# ============================================
server.port=${PORT:8080}
