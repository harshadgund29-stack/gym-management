# SMTP debug — prints full SMTP conversation to console (remove in production)
spring.mail.properties.mail.debug=true


# Sender address shown in "From:" header — must match the authenticated account
spring.mail.from=harshadgund29@gmail.com
spring.mail.test-connection=false

